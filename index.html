<html lang="ru">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ферма «Агроинвест» — виртуальная экскурсия</title>
<style>
:root{
  --panel:#fff; --border:#c9d2c9;
  --text:#1f2d1c; --text-muted:#6b7a68;
  --accent:#4a8a3a; --accent-hover:#3a7029;
  --shadow:0 6px 24px rgba(20,40,20,.18);
  --radius:12px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:14px;color:var(--text);background:#7a9e44;overflow:hidden;
}
.topbar{
  position:fixed;top:0;left:0;right:0;height:60px;
  background:rgba(255,255,255,.94);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;z-index:100;
  box-shadow:0 2px 12px rgba(20,40,20,.06);backdrop-filter:blur(6px);
}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{
  width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,#4a8a3a,#7bc4e0);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:20px;box-shadow:0 2px 8px rgba(74,138,58,.3);
}
.brand-text h1{font-size:16px;font-weight:700;margin:0;letter-spacing:.2px}
.brand-text p{font-size:11px;color:var(--text-muted);margin:2px 0 0}
.top-actions{display:flex;gap:10px;align-items:center}
.tbtn{
  background:var(--panel);border:1px solid var(--border);border-radius:22px;
  padding:8px 16px;font:inherit;font-size:13px;color:var(--text);cursor:pointer;
  transition:all .15s;display:flex;align-items:center;gap:6px;
}
.tbtn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.tbtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tbtn .icon{font-size:15px}

.anim-group{
  display:flex;gap:4px;align-items:center;
  padding-right:10px;margin-right:4px;
  border-right:1px solid var(--border);
}
.tbtn.icon-only{
  padding:8px 11px;font-size:13px;min-width:36px;
  justify-content:center;line-height:1;
}
.tbtn.icon-only.active{
  background:var(--accent);color:#fff;border-color:var(--accent);
}

#map{
  position:fixed;top:60px;left:0;right:0;bottom:0;
  cursor:grab;user-select:none;background:#7a9e44;
  touch-action: none;
}
#map.dragging{cursor:grabbing}
#plan{width:100%;height:100%;display:block}

.building-group{cursor:pointer;transition:filter .2s ease}
.building-group:hover{filter:drop-shadow(0 0 8px rgba(74,138,58,.7))}

/* --- Анимации --- */
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
@keyframes dust-fade { 0% { opacity: 0.6; transform: scale(1); } 100% { opacity: 0; transform: scale(3); } }
@keyframes walk-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1px); } }
@keyframes cow-eat { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-15deg); } }

.hazard-light { animation: blink 0.5s infinite; }
.dust-particle { animation: dust-fade 1s ease-out forwards; }
.worker-body { animation: walk-bob 0.4s infinite; }
.cow-body { animation: cow-eat 1.5s ease-in-out infinite; }
.cow-body.delay { animation-delay: 0.5s; }
.cow-body.delay2 { animation-delay: 1s; }

#dust-layer, #hose-layer, #truck-layer, #ambient-ground, #sky-layer { pointer-events: none; }

.map-controls{
  position:fixed;right:16px;bottom:16px;
  display:flex;flex-direction:column;gap:6px;z-index:50;
  border-radius:var(--radius);background:rgba(255,255,255,.94);
  padding:6px;box-shadow:var(--shadow);
}
.map-controls button{
  width:40px;height:40px;border:none;border-radius:8px;
  background:transparent;cursor:pointer;font-size:18px;color:var(--text);
  transition:background .15s;
}
.map-controls button:hover{background:var(--accent);color:#fff}

.card{
  position:fixed;top:80px;right:20px;
  width:360px;max-width:calc(100vw - 40px);
  max-height:calc(100vh - 100px);
  background:var(--panel);border-radius:var(--radius);
  box-shadow:var(--shadow);z-index:80;display:none;
  overflow:hidden;flex-direction:column;
}
.card.visible{display:flex;animation:cardIn .25s ease-out}
@keyframes cardIn{ from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:translateY(0)} }
.card-header{
  padding:18px 20px 14px;
  background:linear-gradient(135deg,#4a8a3a,#6aab4a);
  color:#fff;position:relative;
}
.card-header h2{margin:0 0 4px;font-size:20px;font-weight:700}
.card-header .code{
  font-size:13px;opacity:.9;display:inline-block;
  background:rgba(255,255,255,.22);padding:2px 10px;border-radius:12px;
}
.card-close{
  position:absolute;top:14px;right:14px;
  width:30px;height:30px;border:none;border-radius:50%;
  background:rgba(255,255,255,.18);color:#fff;font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;line-height:1;
}
.card-close:hover{background:rgba(255,255,255,.3)}
.card-body{padding:16px 20px;overflow-y:auto;flex:1}
.spec-row{
  display:flex;justify-content:space-between;
  padding:9px 0;border-bottom:1px dashed var(--border);font-size:13.5px;
}
.spec-row:last-child{border-bottom:none}
.spec-row .label{color:var(--text-muted);flex:0 0 auto;padding-right:12px}
.spec-row .value{text-align:right;font-weight:500;color:var(--text)}
.card-desc{
  margin-top:14px;padding:12px 14px;background:#f4f8f0;
  border-left:3px solid var(--accent);border-radius:6px;
  font-size:13px;line-height:1.5;color:#4a5a45;
}
.card-actions{
  padding:14px 20px 18px;border-top:1px solid var(--border);
  display:flex;gap:10px;
}
.card-actions a{
  flex:1;text-align:center;padding:11px 14px;border-radius:8px;
  font:inherit;font-size:13px;font-weight:600;cursor:pointer;
  text-decoration:none;border:none;display:inline-flex;
  align-items:center;justify-content:center;gap:6px;
  transition:all .15s;background:var(--accent);color:#fff;
}
.card-actions a:hover{background:var(--accent-hover)}

.legend{
  position:fixed;left:16px;bottom:16px;
  background:rgba(255,255,255,.94);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:14px 16px;z-index:50;
  max-width:220px;font-size:12px;
}
.legend h3{
  margin:0 0 10px;font-size:10px;text-transform:uppercase;
  letter-spacing:1px;color:var(--text-muted);font-weight:700;
}
.legend-item{display:flex;align-items:center;gap:8px;padding:3px 0}
.legend-swatch{
  width:16px;height:16px;border-radius:4px;
  flex:0 0 auto;border:1px solid rgba(0,0,0,.12);
}
.hint{
  position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
  background:rgba(255,255,255,.94);border-radius:22px;padding:8px 18px;
  font-size:12.5px;color:var(--text-muted);box-shadow:var(--shadow);
  z-index:40;transition:opacity .3s;text-align:center;
}
.hint.hidden{opacity:0;pointer-events:none}

@media (max-width:768px){
  .topbar{padding:0 10px;height:54px}
  .brand-text h1{font-size:13px}
  .brand-text p{display:none}
  .brand-logo{width:34px;height:34px;font-size:17px}
  .tbtn{padding:7px 12px;font-size:12px}
  .tbtn .label{display:none}
  .top-actions{gap:6px}
  .anim-group{gap:3px;padding-right:6px;margin-right:2px}
  .tbtn.icon-only{padding:7px 9px;min-width:32px;font-size:12px}
  #map{top:54px}
  .card{
    top:auto;bottom:0;left:0;right:0;width:100%;
    max-width:none;max-height:70vh;
    border-radius:var(--radius) var(--radius) 0 0;
  }
  @keyframes cardIn{ from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
  .legend{display:none}
  .map-controls{right:10px;bottom:10px}
  .hint{font-size:11px;padding:6px 14px;max-width:calc(100vw - 24px)}
}
</style>

function computeBounds(){

  });
  APP.buildingBounds = { minX:minX, minY:minY, maxX:maxX, maxY:maxY };

  APP.bounds = { minX: minX - w*0.35, maxX: maxX + w*0.55, minY: minY - h*0.20, maxY: maxY + h*0.20 };
}

function toSvg(x, y){ var b = APP.bounds; return [ x - b.minX, b.maxY - y ]; }

function pathFromCoords(coords, close){
  var pts = coords.map(function(c){ return toSvg(c[0], c[1]); });
  var d = "M " + pts[0][0] + " " + pts[0][1];
  for(var i=1;i<pts.length;i++){ d += " L " + pts[i][0] + " " + pts[i][1]; }
  if(close) d += " Z";
  return d;
}

function bboxOfCoords(coords){
  var minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  coords.forEach(function(c){ if(c[0]<minX)minX=c[0]; if(c[0]>maxX)maxX=c[0]; if(c[1]<minY)minY=c[1]; if(c[1]>maxY)maxY=c[1]; });
  return { minX:minX, minY:minY, maxX:maxX, maxY:maxY, w:maxX-minX, h:maxY-minY };
}

function drawBuilding(layer, building){
  var palette = COLORS_BY_GROUP[building.group] || COLORS_BY_GROUP["Корпуса"];
  var pts = building.coords.map(function(c){ return toSvg(c[0], c[1]); });
  var minY = Infinity, maxY = -Infinity;
  pts.forEach(function(p){ if(p[1] < minY) minY = p[1]; if(p[1] > maxY) maxY = p[1]; });
  var wallHeight = Math.max(10, Math.min(25, (maxY - minY) * 0.4));

  var g = el("g", { "class":"building-group", "data-id": building.id });
  g.setAttribute("filter", "url(#soft-shadow)");

  var shadowD = "";
  pts.forEach(function(p, i){ shadowD += (i===0 ? "M " : "L ") + (p[0] + 5) + " " + (p[1] + wallHeight + 5); });
  shadowD += " Z";
  g.appendChild(el("path", { d: shadowD, fill: "#000", opacity: 0.15 }));

  var wallD = "";
  pts.forEach(function(p, i){ var isBottom = p[1] > (minY + maxY) / 2; wallD += (i===0 ? "M " : "L ") + p[0] + " " + (isBottom ? p[1] + wallHeight : p[1]); });
  wallD += " Z";
  g.appendChild(el("path", { d: wallD, fill: palette.fill, stroke: palette.stroke, "stroke-width": 1 }));

  var roofD = "";
  pts.forEach(function(p, i){ roofD += (i===0 ? "M " : "L ") + (p[0] + 1) + " " + (p[1] - 4); });
  roofD += " Z";
  
  // Применяем текстуру крыши
  g.appendChild(el("path", { d: roofD, fill: "url(#roof-pattern)", stroke: palette.stroke, "stroke-width": 1.5, "stroke-linejoin": "round" }));
  g.appendChild(el("path", { d: roofD, fill: palette.roof, opacity: 0.4, "pointer-events": "none" }));

  if(building.coords.length === 4){
    var mid1 = toSvg((building.coords[0][0]+building.coords[1][0])/2, (building.coords[0][1]+building.coords[1][1])/2);
    var mid2 = toSvg((building.coords[2][0]+building.coords[3][0])/2, (building.coords[2][1]+building.coords[3][1])/2);
    g.appendChild(el("line", { x1: mid1[0]+1, y1: mid1[1]-4, x2: mid2[0]+1, y2: mid2[1]-4, stroke: palette.roofLine, "stroke-width": 2, opacity: 0.6 }));
  }

  g.addEventListener("click", function(ev){ ev.stopPropagation(); openCard(building); highlightBuilding(g); });
  layer.appendChild(g);
}

function createPathData(pathPoints) {
  var pts = pathPoints.map(function(p){ return toSvg(p.x, p.y); });
  var segs = [], total = 0;
  for (var i = 1; i < pts.length; i++) {
    var dx = pts[i][0] - pts[i-1][0], dy = pts[i][1] - pts[i-1][1], len = Math.sqrt(dx*dx + dy*dy);
    segs.push({ x1: pts[i-1][0], y1: pts[i-1][1], x2: pts[i][0], y2: pts[i][1], len: len, start: total });
    total += len;
  }
  return { segs: segs, total: total };
}

function getPointOnPath(pathData, d) {
  if (pathData.segs.length === 0) return { x:0, y:0, angle:0 };
  if (d <= 0) { var s = pathData.segs[0]; return { x: s.x1, y: s.y1, angle: Math.atan2(s.y2-s.y1, s.x2-s.x1)*180/Math.PI }; }
  for (var i=0; i<pathData.segs.length; i++) {
    var s = pathData.segs[i];
    if (d <= s.start + s.len) {
      var t = s.len > 0 ? (d - s.start) / s.len : 0;
      return { x: s.x1 + (s.x2-s.x1)*t, y: s.y1 + (s.y2-s.y1)*t, angle: Math.atan2(s.y2-s.y1, s.x2-s.x1)*180/Math.PI };
    }
  }
  var last = pathData.segs[pathData.segs.length-1];
  return { x: last.x2, y: last.y2, angle: Math.atan2(last.y2-last.y1, last.x2-last.x1)*180/Math.PI };
}

function getTrailPath(pathData, dist) {
  if (dist <= 0) return "";
  var d = "M " + pathData.segs[0].x1 + " " + pathData.segs[0].y1;
  for (var i = 0; i < pathData.segs.length; i++) {
    var s = pathData.segs[i];
    if (dist >= s.start + s.len) {
      d += " L " + s.x2 + " " + s.y2;
    } else {
      var t = (dist - s.start) / s.len;
      d += " L " + (s.x1 + (s.x2 - s.x1) * t) + " " + (s.y1 + (s.y2 - s.y1) * t);
      break;
    }
  }
  return d;
}

function initAmbient() {
  var groundLayer = document.getElementById("ambient-ground");
  var skyLayer = document.getElementById("sky-layer");
  var rnd = makeRandom(42);
  
  // КОРОВЫ (Сдвинуты правее, в центр левого поля)
  var cowBaseX = 1400650, cowBaseY = 457850;
  for (var i=0; i<10; i++) {
    var c = buildCow();
    var posX = cowBaseX + (rnd() - 0.5) * 120;
    var posY = cowBaseY + (rnd() - 0.5) * 120;
    var pt = toSvg(posX, posY);
    var angle = rnd() * 360;
    
    c.el.setAttribute("transform", "translate(" + pt[0] + "," + pt[1] + ")");
    c.body.setAttribute("transform", "rotate(" + angle + ")");
    
    if (i % 2 === 0) c.body.classList.add("delay");
    if (i % 3 === 0) c.body.classList.add("delay2");
    groundLayer.appendChild(c.el);
  }

  // ЛЕВЫЙ ТРАКТОР (сдвинут влево и вниз)
  var tractorPath1 = createPathData([{x:1400200, y:457600}, {x:1400200, y:457200}, {x:1400600, y:457200}, {x:1400600, y:457600}, {x:1400200, y:457600}]);
  var tr1 = buildTractor();
  AMBIENT.tractors.push({ el: tr1.el, body: tr1.body, path: tractorPath1, dist: 0, speed: 20, trailEl: el("path", { fill:"none", stroke:"#5a4a30", "stroke-width":3, opacity:0.4 }) });
  groundLayer.appendChild(AMBIENT.tractors[0].trailEl);
  groundLayer.appendChild(tr1.el);

  // ПРАВЫЙ ТРАКТОР (сдвинут дальше вправо, чтобы не заезжать на дорогу)
  var tractorPath2 = createPathData([{x:1401500, y:458300}, {x:1401500, y:457900}, {x:1401900, y:457900}, {x:1401900, y:458300}, {x:1401500, y:458300}]);
  var tr2 = buildTractor();
  AMBIENT.tractors.push({ el: tr2.el, body: tr2.body, path: tractorPath2, dist: 0, speed: 18, trailEl: el("path", { fill:"none", stroke:"#5a4a30", "stroke-width":3, opacity:0.4 }) });
  groundLayer.appendChild(AMBIENT.tractors[1].trailEl);
  groundLayer.appendChild(tr2.el);

  // РАБОЧИЕ
  var wPaths = [
    createPathData([{x:1401150, y:458380}, {x:1401180, y:458380}, {x:1401180, y:458350}]),
    createPathData([{x:1400980, y:457800}, {x:1400980, y:457700}]),
    createPathData([{x:1400980, y:458200}, {x:1400980, y:458300}]),
    createPathData([{x:1400860, y:457600}, {x:1400860, y:457700}])
  ];
  wPaths.forEach(function(path, i) {
    var w = buildWorker();
    AMBIENT.workers.push({ el: w.el, body: w.body, path: path, dist: Math.random() * 20, speed: 10 + Math.random()*5, dir: 1, pause: 0 });
    groundLayer.appendChild(w.el);
  });

  // САМОЛЕТ
  var plane = buildAirplane();
  skyLayer.appendChild(plane);
  AMBIENT.airplane = {
    el: plane,
    x: APP.baseViewBox.w * 0.3,
    y: APP.baseViewBox.h + 300,
    speed: 150,
    active: true,
    delay: 2
  };
}

function ambientLoop(ts) {
  if (!AMBIENT.lastTs) AMBIENT.lastTs = ts;
  var dt = (ts - AMBIENT.lastTs) / 1000;
  AMBIENT.lastTs = ts;
  if (dt > 0.1) dt = 0.1;

  AMBIENT.tractors.forEach(function(tr) {
    tr.dist += tr.speed * dt;
    if (tr.dist > tr.path.total) tr.dist = 0;
    var p = getPointOnPath(tr.path, tr.dist);
    tr.el.setAttribute("transform", "translate(" + p.x + "," + p.y + ")");
    tr.body.setAttribute("transform", "rotate(" + p.angle + ")");
    tr.trailEl.setAttribute("d", getTrailPath(tr.path, tr.dist));
  });

  AMBIENT.workers.forEach(function(w) {
    if (w.pause > 0) { w.pause -= dt; return; }
    w.dist += w.speed * dt * w.dir;
    if (w.dist > w.path.total) { w.dist = w.path.total; w.dir = -1; w.pause = 2; }
    if (w.dist < 0) { w.dist = 0; w.dir = 1; w.pause = 2; }
    var p = getPointOnPath(w.path, w.dist);
    var angle = p.angle + (w.dir === -1 ? 180 : 0);
    w.el.setAttribute("transform", "translate(" + p.x + "," + p.y + ")");
    w.body.setAttribute("transform", "rotate(" + angle + ")");
  });

  if (AMBIENT.airplane) {
    var a = AMBIENT.airplane;
    if (a.active) {
      a.y -= a.speed * dt;
      a.el.setAttribute("transform", "translate(" + a.x + ", " + a.y + ")");
      
      if (a.y < -300) {
        a.active = false;
        a.y = APP.baseViewBox.h + 300;
        a.x = APP.baseViewBox.w * 0.1 + Math.random() * APP.baseViewBox.w * 0.8;
        a.el.setAttribute("opacity", 0);
      }
    } else {
      a.delay -= dt;
      if (a.delay <= 0) {
        a.active = true;
        a.el.setAttribute("opacity", 1);
        a.delay = 15 + Math.random() * 10;
      }
    }
  }

  AMBIENT.rafId = requestAnimationFrame(ambientLoop);
}

function buildTruckRoute(){
  TRUCK.pts = FARM.truckRoute.points.map(function(p){ var s = toSvg(p.x, p.y); return { x:s[0], y:s[1], action:p.action || null }; });
  TRUCK.segs = []; TRUCK.total = 0; TRUCK.loadDist = 0;
  for(var i=1;i<TRUCK.pts.length;i++){
    var a = TRUCK.pts[i-1], b = TRUCK.pts[i], dx = b.x - a.x, dy = b.y - a.y, len = Math.sqrt(dx*dx + dy*dy);
    TRUCK.segs.push({ x1:a.x, y1:a.y, x2:b.x, y2:b.y, len:len, start:TRUCK.total });
    TRUCK.total += len;
    if(b.action === "load") TRUCK.loadDist = TRUCK.total;
  }
}

function truckPointAt(d){
  if(TRUCK.segs.length === 0) return { x:0, y:0, angle:0 };
  if(d <= 0){ var s0 = TRUCK.segs[0]; return { x:s0.x1, y:s0.y1, angle: Math.atan2(s0.y2 - s0.y1, s0.x2 - s0.x1) * 180 / Math.PI }; }
  for(var i=0;i<TRUCK.segs.length;i++){
    var s = TRUCK.segs[i];
    if(d <= s.start + s.len){
      var t = s.len > 0 ? (d - s.start) / s.len : 0;
      return { x: s.x1 + (s.x2 - s.x1) * t, y: s.y1 + (s.y2 - s.y1) * t, angle: Math.atan2(s.y2 - s.y1, s.x2 - s.x1) * 180 / Math.PI };
    }
  }
  var last = TRUCK.segs[TRUCK.segs.length - 1];
  return { x:last.x2, y:last.y2, angle: Math.atan2(last.y2 - last.y1, last.x2 - last.x1) * 180 / Math.PI };
}

function angleLerp(a, b, t){ var d = b - a; while(d > 180) d -= 360; while(d < -180) d += 360; return a + d * t; }

function spawnDust(x, y) {
  if (!TRUCK.dustLayer) return;
  var size = 2 + Math.random() * 3;
  var dust = el("circle", { cx: x, cy: y, r: size, fill: "#c8b888", class: "dust-particle" });
  TRUCK.dustLayer.appendChild(dust);
  setTimeout(function() { if (dust.parentNode) dust.parentNode.removeChild(dust); }, 1000);
}

function truckUpdate(dt){
  if(TRUCK.state === "moving"){
    TRUCK.dist += FARM.truckRoute.speed * dt;
    TRUCK.dustTimer += dt;
    if (TRUCK.dustTimer > 0.1) {
      TRUCK.dustTimer = 0;
      var p = truckPointAt(TRUCK.dist - 15);
      spawnDust(p.x, p.y);
    }

    if(!TRUCK.loaded && TRUCK.loadDist > 0 && TRUCK.dist >= TRUCK.loadDist){ TRUCK.dist = TRUCK.loadDist; TRUCK.loadTimer = 0; setTruckState("loading"); }
    else if(TRUCK.dist >= TRUCK.total){ TRUCK.dist = TRUCK.total; TRUCK.loaded = true; setTruckState("completed"); }
  } else if(TRUCK.state === "loading"){
    TRUCK.loadTimer += dt;
    if(TRUCK.loadTimer >= FARM.truckRoute.loadDuration){ TRUCK.loadTimer = FARM.truckRoute.loadDuration; TRUCK.loaded = true; setTruckState("moving"); }
  }
}

function truckRender(instant){
  if(!TRUCK.el) return;
  var p = truckPointAt(TRUCK.dist);
  TRUCK.angle = instant ? p.angle : angleLerp(TRUCK.angle, p.angle, 0.20);
  
  var bounceY = 0;
  if (TRUCK.state === "moving") {
    TRUCK.bouncePhase += 0.2;
    bounceY = Math.sin(TRUCK.bouncePhase) * 1.2;
  }

  TRUCK.el.setAttribute("transform", "translate(" + p.x.toFixed(2) + "," + (p.y + bounceY).toFixed(2) + ") rotate(" + TRUCK.angle.toFixed(2) + ")");
  
  if(TRUCK.milkEl){
    var prog = TRUCK.state === "loading" ? Math.min(1, TRUCK.loadTimer / FARM.truckRoute.loadDuration) : (TRUCK.loaded ? 1 : 0);
    var w = 17 * prog;
    TRUCK.milkEl.setAttribute("width", w.toFixed(2));
    TRUCK.milkEl.setAttribute("rx", Math.min(3, w/2).toFixed(2));
    TRUCK.milkEl.setAttribute("opacity", prog > 0.02 ? 1 : 0);
  }
  
  if(TRUCK.statusEl){
    var show = (TRUCK.state === "loading");
    TRUCK.statusEl.setAttribute("opacity", show ? 1 : 0);
    if(show) TRUCK.statusEl.setAttribute("transform", "translate(" + p.x.toFixed(2) + "," + (p.y - 20 + bounceY).toFixed(2) + ")");
  }

  if (TRUCK.hazardL && TRUCK.hazardR) {
    var showHazards = (TRUCK.state === "loading" || TRUCK.state === "paused");
    TRUCK.hazardL.setAttribute("opacity", showHazards ? 1 : 0);
    TRUCK.hazardR.setAttribute("opacity", showHazards ? 1 : 0);
  }

  if (TRUCK.hoseEl) {
    if (TRUCK.state === "loading") {
      var dmbPt = toSvg(1400950, 458205); 
      var truckPt = p;
      TRUCK.hoseEl.setAttribute("d", "M " + dmbPt[0] + " " + dmbPt[1] + " Q " + ((dmbPt[0]+truckPt.x)/2) + " " + (dmbPt[1]-15) + " " + truckPt.x + " " + truckPt.y);
      TRUCK.hoseEl.setAttribute("opacity", 1);
    } else {
      TRUCK.hoseEl.setAttribute("opacity", 0);
    }
  }
}

function truckLoop(ts){
  if(!TRUCK.lastTs) TRUCK.lastTs = ts;
  var dt = (ts - TRUCK.lastTs) / 1000; TRUCK.lastTs = ts;
  if(dt > 0.1) dt = 0.1; if(dt < 0) dt = 0;
  truckUpdate(dt); truckRender(false);
  if(TRUCK.state === "moving" || TRUCK.state === "loading") TRUCK.rafId = requestAnimationFrame(truckLoop);
  else { TRUCK.rafId = null; updateAnimButtons(); }
}

function setTruckState(s){ if(TRUCK.state === s) return; TRUCK.state = s; updateAnimButtons(); }

function truckPlay(){
  if(TRUCK.state === "completed") truckReset();
  if(TRUCK.state === "idle") TRUCK.state = "moving";
  else if(TRUCK.state === "paused") { TRUCK.state = TRUCK.prevState || "moving"; TRUCK.prevState = null; }
  else { updateAnimButtons(); return; }
  TRUCK.lastTs = 0; if(!TRUCK.rafId) TRUCK.rafId = requestAnimationFrame(truckLoop); updateAnimButtons();
}

function truckPause(){
  if(TRUCK.state === "moving" || TRUCK.state === "loading"){
    TRUCK.prevState = TRUCK.state; TRUCK.state = "paused";
    if(TRUCK.rafId){ cancelAnimationFrame(TRUCK.rafId); TRUCK.rafId = null; }
    updateAnimButtons();
  }
}

function truckReset(){
  if(TRUCK.rafId){ cancelAnimationFrame(TRUCK.rafId); TRUCK.rafId = null; }
  TRUCK.dist = 0; TRUCK.state = "idle"; TRUCK.prevState = null; TRUCK.loadTimer = 0; TRUCK.loaded = false; TRUCK.lastTs = 0;
  if (TRUCK.dustLayer) TRUCK.dustLayer.innerHTML = "";
  truckRender(true); updateAnimButtons();
}

function updateAnimButtons(){
  var play = document.getElementById("anim-play"), pause = document.getElementById("anim-pause");
  if(!play || !pause) return;
  play.classList.toggle("active", (TRUCK.state === "moving" || TRUCK.state === "loading"));
  pause.classList.toggle("active", TRUCK.state === "paused");
}

function initTruckAnim(){
  buildTruckRoute();
  if(TRUCK.segs.length > 0){ var s0 = TRUCK.segs[0]; TRUCK.angle = Math.atan2(s0.y2 - s0.y1, s0.x2 - s0.x1) * 180 / Math.PI; }
  TRUCK.dist = 0; TRUCK.state = "idle"; TRUCK.loaded = false; TRUCK.loadTimer = 0;
  truckRender(true); updateAnimButtons();
  document.getElementById("anim-play").addEventListener("click", truckPlay);
  document.getElementById("anim-pause").addEventListener("click", truckPause);
  document.getElementById("anim-reset").addEventListener("click", truckReset);
}

   UI И ИНТЕРАКТИВ

function openCard(building){
  var card = document.getElementById("card");
  document.getElementById("card-name").textContent = building.name;
  document.getElementById("card-code").textContent = building.code + " · " + building.group;
  var body = document.getElementById("card-body"); body.innerHTML = "";
  var rows = [];
  if(building.purpose) rows.push(["Назначение", building.purpose]);
  if(building.capacity) rows.push(["Вместимость", building.capacity + " " + (building.unit || "")]);
  rows.forEach(function(pair){ var row = document.createElement("div"); row.className = "spec-row"; row.innerHTML = '<span class="label">' + escapeHtml(pair[0]) + '</span><span class="value">' + escapeHtml(pair[1]) + '</span>'; body.appendChild(row); });
  if(building.description){ var desc = document.createElement("div"); desc.className = "card-desc"; desc.textContent = building.description; body.appendChild(desc); }
  var tourBtn = document.getElementById("card-tour"), tourUrl = "https://jerseyfarm.ru/3dtour/Agroinvest.html";
  if(building.tourScene) tourUrl += "#" + building.tourScene;
  tourBtn.href = tourUrl;
  card.classList.add("visible");
}

function closeCard(){
  document.getElementById("card").classList.remove("visible");
  APP.svg.querySelectorAll(".building-group").forEach(function(el2){
    el2.setAttribute("filter", "url(#soft-shadow)");
    var paths = el2.querySelectorAll("path"); if(paths[0]) paths[0].setAttribute("stroke-width", 1);
  });
}

function highlightBuilding(g){
  APP.svg.querySelectorAll(".building-group").forEach(function(el2){
    el2.setAttribute("filter", "url(#soft-shadow)");
    var paths = el2.querySelectorAll("path"); if(paths[0]) paths[0].setAttribute("stroke-width", 1);
  });
  var paths = g.querySelectorAll("path"); if(paths[0]) paths[0].setAttribute("stroke-width", 2.8);
}

function escapeHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }

function clampViewBox(vb) {
  var baseW = APP.baseViewBox.w, baseH = APP.baseViewBox.h;
  var minW = baseW * 0.15, maxW = baseW * 1.3;
  if (vb.w < minW) { vb.w = minW; vb.h = minW * (baseH / baseW); }
  if (vb.w > maxW) { vb.w = maxW; vb.h = maxW * (baseH / baseW); }
  var paddingX = vb.w * 0.2, paddingY = vb.h * 0.2;
  var minX = -paddingX, maxX = baseW - vb.w + paddingX;
  var minY = -paddingY, maxY = baseH - vb.h + paddingY;
  if (vb.x < minX) vb.x = minX; if (vb.x > maxX) vb.x = maxX;
  if (vb.y < minY) vb.y = minY; if (vb.y > maxY) vb.y = maxY;
  return vb;
}

function initPanZoom(){
  var map = document.getElementById("map"), svg = APP.svg;
  var startClientX = 0, startClientY = 0, startVB = null;
  var isDragging = false, rafId = null;

  map.addEventListener("mousedown", function(e){
    if(e.button !== 0 || e.target.closest(".building-group")) return;
    isDragging = true;
    map.classList.add("dragging");
    startClientX = e.clientX; startClientY = e.clientY;
    startVB = { x: APP.viewBox.x, y: APP.viewBox.y, w: APP.viewBox.w, h: APP.viewBox.h };
    e.preventDefault();
  });

  window.addEventListener("mousemove", function(e){
    if(!isDragging) return;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(function() {
      var rect = svg.getBoundingClientRect();
      var dxPx = e.clientX - startClientX, dyPx = e.clientY - startClientY;
      var dxSvg = dxPx * (startVB.w / rect.width), dySvg = dyPx * (startVB.h / rect.height);
      APP.viewBox = clampViewBox({ x: startVB.x - dxSvg, y: startVB.y - dySvg, w: startVB.w, h: startVB.h });
      applyViewBox();
    });
  });

  window.addEventListener("mouseup", function(){
    if(isDragging) {
      isDragging = false;
      map.classList.remove("dragging");
      if (rafId) cancelAnimationFrame(rafId);
    }
  });

  map.addEventListener("wheel", function(e){
    e.preventDefault();
    var rect = svg.getBoundingClientRect();
    var cx = (e.clientX - rect.left) / rect.width, cy = (e.clientY - rect.top) / rect.height;
    var px = APP.viewBox.x + cx * APP.viewBox.w, py = APP.viewBox.y + cy * APP.viewBox.h;
    var factor = e.deltaY < 0 ? 0.85 : 1/0.85;
    var nw = APP.viewBox.w * factor, nh = APP.viewBox.h * factor;
    APP.viewBox = clampViewBox({ x: px - cx * nw, y: py - cy * nh, w: nw, h: nh });
    applyViewBox();
  }, { passive: false });

  var touchStartDist = 0;
  var touchStartVB = null;

  map.addEventListener("touchstart", function(e){
    if(e.target.closest(".building-group")) return;
    
    if(e.touches.length === 1) {
      isDragging = true;
      startClientX = e.touches[0].clientX;
      startClientY = e.touches[0].clientY;
      startVB = { x: APP.viewBox.x, y: APP.viewBox.y, w: APP.viewBox.w, h: APP.viewBox.h };
    } else if (e.touches.length === 2) {
      isDragging = false;
      touchStartDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      touchStartVB = { x: APP.viewBox.x, y: APP.viewBox.y, w: APP.viewBox.w, h: APP.viewBox.h };
    }
  }, { passive: false });

  map.addEventListener("touchmove", function(e){
    e.preventDefault();
    
    if(e.touches.length === 1 && isDragging && startVB) {
      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(function() {
        var rect = svg.getBoundingClientRect();
        var dxPx = e.touches[0].clientX - startClientX;
        var dyPx = e.touches[0].clientY - startClientY;
        var dxSvg = dxPx * (startVB.w / rect.width);
        var dySvg = dyPx * (startVB.h / rect.height);
        APP.viewBox = clampViewBox({ x: startVB.x - dxSvg, y: startVB.y - dySvg, w: startVB.w, h: startVB.h });
        applyViewBox();
      });
    } else if (e.touches.length === 2 && touchStartVB) {
      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(function() {
        var dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        var factor = touchStartDist / dist;
        var nw = touchStartVB.w * factor;
        var nh = touchStartVB.h * factor;
        
        var rect = svg.getBoundingClientRect();
        var cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        var cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        
        var ratioX = (cx - rect.left) / rect.width;
        var ratioY = (cy - rect.top) / rect.height;
        
        var px = touchStartVB.x + ratioX * touchStartVB.w;
        var py = touchStartVB.y + ratioY * touchStartVB.h;
        
        APP.viewBox = clampViewBox({
          x: px - ratioX * nw,
          y: py - ratioY * nh,
          w: nw,
          h: nh
        });
        applyViewBox();
      });
    }
  }, { passive: false });

  map.addEventListener("touchend", function(e){
    if (e.touches.length === 0) {
      isDragging = false;
      touchStartVB = null;
      if (rafId) cancelAnimationFrame(rafId);
    } else if (e.touches.length === 1) {
      isDragging = true;
      startClientX = e.touches[0].clientX;
      startClientY = e.touches[0].clientY;
      startVB = { x: APP.viewBox.x, y: APP.viewBox.y, w: APP.viewBox.w, h: APP.viewBox.h };
      touchStartVB = null;
    }
  });
}

function applyViewBox(){ var v = APP.viewBox; APP.svg.setAttribute("viewBox", v.x + " " + v.y + " " + v.w + " " + v.h); }
function zoomBy(factor){ var v = APP.viewBox, cx = v.x + v.w/2, cy = v.y + v.h/2, nw = v.w * factor, nh = v.h * factor; APP.viewBox = clampViewBox({ x:cx-nw/2, y:cy-nh/2, w:nw, h:nh }); applyViewBox(); }
function zoomFit(){ APP.viewBox = { x:0, y:0, w:APP.baseViewBox.w, h:APP.baseViewBox.h }; applyViewBox(); }

  var list = document.getElementById("legend-list"); list.innerHTML = "";

}
